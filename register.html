<!DOCTYPE html>

<html class="dark" lang="id">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Pendaftaran Koperasi - KoPintar</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Tailwind Config -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "inverse-primary": "#842bd2",
              "secondary-fixed": "#6ffbbe",
              "on-primary": "#490080",
              surface: "#131313",
              tertiary: "#c0c1ff",
              "surface-container-low": "#1c1b1b",
              "on-surface-variant": "#cfc2d6",
              "on-tertiary-fixed-variant": "#2f2ebe",
              "primary-fixed-dim": "#ddb7ff",
              primary: "#ddb7ff",
              "surface-container": "#201f1f",
              "inverse-surface": "#e5e2e1",
              "surface-dim": "#131313",
              "surface-container-highest": "#353534",
              "tertiary-fixed": "#e1e0ff",
              "on-primary-fixed": "#2c0051",
              "on-tertiary-container": "#0d0096",
              "tertiary-fixed-dim": "#c0c1ff",
              "inverse-on-surface": "#313030",
              "on-primary-container": "#400071",
              "surface-container-high": "#2a2a2a",
              "outline-variant": "#4d4354",
              "on-secondary-fixed-variant": "#005236",
              "on-tertiary": "#1000a9",
              "surface-container-lowest": "#0e0e0e",
              "error-container": "#93000a",
              error: "#ffb4ab",
              "secondary-fixed-dim": "#4edea3",
              "on-tertiary-fixed": "#07006c",
              "on-background": "#e5e2e1",
              "primary-container": "#b76dff",
              outline: "#988d9f",
              "tertiary-container": "#8083ff",
              background: "#131313",
              "on-secondary-container": "#00311f",
              "secondary-container": "#00a572",
              "surface-bright": "#393939",
              "on-primary-fixed-variant": "#6900b3",
              "on-secondary": "#003824",
              "on-secondary-fixed": "#002113",
              "on-surface": "#e5e2e1",
              "on-error": "#690005",
              "on-error-container": "#ffdad6",
              "surface-variant": "#353534",
              "surface-tint": "#ddb7ff",
              secondary: "#4edea3",
              "primary-fixed": "#f0dbff",
            },
            borderRadius: {
              DEFAULT: "0.25rem",
              lg: "0.5rem",
              xl: "0.75rem",
              full: "9999px",
            },
            spacing: {
              "stack-sm": "0.5rem",
              gutter: "1.5rem",
              "sidebar-width": "280px",
              "stack-lg": "2rem",
              "container-padding": "2rem",
              "stack-md": "1rem",
            },
            fontFamily: {
              "label-md": ["Inter"],
              "headline-lg": ["Plus Jakarta Sans"],
              "body-lg": ["Plus Jakarta Sans"],
              "headline-lg-mobile": ["Plus Jakarta Sans"],
              "body-sm": ["Plus Jakarta Sans"],
              "display-lg": ["Plus Jakarta Sans"],
              "body-md": ["Plus Jakarta Sans"],
              "headline-md": ["Plus Jakarta Sans"],
            },
            fontSize: {
              "label-md": [
                "12px",
                {
                  lineHeight: "1",
                  letterSpacing: "0.05em",
                  fontWeight: "600",
                },
              ],
              "headline-lg": [
                "32px",
                {
                  lineHeight: "1.2",
                  letterSpacing: "-0.01em",
                  fontWeight: "600",
                },
              ],
              "body-lg": [
                "18px",
                {
                  lineHeight: "1.6",
                  fontWeight: "400",
                },
              ],
              "headline-lg-mobile": [
                "28px",
                {
                  lineHeight: "1.2",
                  fontWeight: "600",
                },
              ],
              "body-sm": [
                "14px",
                {
                  lineHeight: "1.5",
                  fontWeight: "400",
                },
              ],
              "display-lg": [
                "48px",
                {
                  lineHeight: "1.1",
                  letterSpacing: "-0.02em",
                  fontWeight: "700",
                },
              ],
              "body-md": [
                "16px",
                {
                  lineHeight: "1.6",
                  fontWeight: "400",
                },
              ],
              "headline-md": [
                "24px",
                {
                  lineHeight: "1.3",
                  fontWeight: "600",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .icon-fill {
        font-variation-settings: "FILL" 1;
      }

      /* Subtle global background glow */
      body::before {
        content: "";
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle at 50% 50%,
          rgba(132, 43, 210, 0.03) 0%,
          rgba(19, 19, 19, 0) 50%
        );
        z-index: -1;
        pointer-events: none;
      }

      /* Input specific focus ring overriding default tailwind form styles for dark mode */
      input:focus,
      select:focus,
      textarea:focus {
        box-shadow: 0 0 0 2px rgba(221, 183, 255, 0.3) !important;
        border-color: #ddb7ff !important;
      }
    </style>
  </head>
  <body
    class="bg-background text-on-surface min-h-screen flex items-center justify-center p-4 antialiased selection:bg-primary-container selection:text-on-primary-container"
  >
    <!-- Main Container -->
    <main class="w-full max-w-[800px] relative">
      <!-- Decorative Ambient Light -->
      <div
        class="absolute -top-20 -left-20 w-64 h-64 bg-primary/10 rounded-full blur-[100px] pointer-events-none"
      ></div>
      <div
        class="absolute -bottom-20 -right-20 w-64 h-64 bg-secondary/10 rounded-full blur-[100px] pointer-events-none"
      ></div>
      <!-- Onboarding Card -->
      <div
        class="bg-surface-container border border-outline-variant rounded-xl shadow-[0_8px_30px_rgb(0,0,0,0.5)] overflow-hidden relative z-10"
      >
        <!-- Header Section -->
        <div class="px-8 pt-8 pb-6 border-b border-outline-variant/50">
          <div class="flex items-center gap-3 mb-6">
            <div
              class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center border border-primary/20 text-primary"
            >
              <span class="material-symbols-outlined icon-fill"
                >agriculture</span
              >
            </div>
            <div>
              <h1 class="text-headline-md font-headline-md text-on-surface">
                Pendaftaran Koperasi
              </h1>
              <p class="text-body-sm font-body-sm text-on-surface-variant mt-1">
                Langkah awal digitalisasi koperasi Anda bersama KoPintar.
              </p>
            </div>
          </div>
          <!-- Progress Stepper -->
          <div class="relative">
            <div
              class="absolute top-1/2 left-0 w-full h-[2px] bg-surface-container-highest -z-10 -translate-y-1/2"
            ></div>
            <!-- Active Line Progress -->
            <div
              class="absolute top-1/2 left-0 w-0 h-[2px] bg-primary -z-10 -translate-y-1/2 transition-all duration-500"
              style="width: 15%"
            ></div>
            <div class="flex justify-between relative z-10">
              <!-- Step 1: Active -->
              <div class="flex flex-col items-center gap-2">
                <div
                  class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-md text-label-md shadow-[0_0_10px_rgba(221,183,255,0.4)]"
                >
                  1
                </div>
                <span
                  class="text-label-md font-label-md text-primary tracking-wide uppercase"
                  >Profil</span
                >
              </div>
              <!-- Step 2: Inactive -->
              <div class="flex flex-col items-center gap-2">
                <div
                  class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant border border-outline-variant flex items-center justify-center font-label-md text-label-md"
                >
                  2
                </div>
                <span
                  class="text-label-md font-label-md text-on-surface-variant tracking-wide uppercase"
                  >Lokasi</span
                >
              </div>
              <!-- Step 3: Inactive -->
              <div class="flex flex-col items-center gap-2">
                <div
                  class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant border border-outline-variant flex items-center justify-center font-label-md text-label-md"
                >
                  3
                </div>
                <span
                  class="text-label-md font-label-md text-on-surface-variant tracking-wide uppercase"
                  >Modul</span
                >
              </div>
            </div>
          </div>
        </div>
        <!-- Form Content Section -->
        <div class="p-8">
          <div class="mb-8">
            <h2
              class="text-body-lg font-body-lg text-on-surface font-semibold mb-2"
            >
              1. Informasi Dasar
            </h2>
            <p class="text-body-sm font-body-sm text-on-surface-variant">
              Lengkapi data profil utama koperasi untuk keperluan identifikasi
              sistem.
            </p>
          </div>
          <form class="space-y-6">
            <!-- Input: Nama Koperasi -->
            <div class="space-y-2">
              <label
                class="text-label-md font-label-md text-on-surface uppercase tracking-wider block"
                for="koperasiName"
                >Nama Koperasi</label
              >
              <div class="relative">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant"
                >
                  <span class="material-symbols-outlined text-[20px]"
                    >storefront</span
                  >
                </div>
                <input
                  class="block w-full pl-10 pr-3 py-3 bg-surface-container-high border border-outline-variant rounded-lg text-on-surface text-body-md font-body-md placeholder-on-surface-variant/50 focus:outline-none transition-colors duration-200"
                  id="koperasiName"
                  placeholder="Masukkan nama resmi koperasi"
                  type="text"
                  value="Koperasi Harapan Baru"
                />
              </div>
            </div>
            <!-- Input: Jenis Koperasi -->
            <div class="space-y-2">
              <label
                class="text-label-md font-label-md text-on-surface uppercase tracking-wider block"
                for="koperasiType"
                >Kategori / Jenis Koperasi</label
              >
              <div class="relative">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant"
                >
                  <span class="material-symbols-outlined text-[20px]"
                    >category</span
                  >
                </div>
                <select
                  class="block w-full pl-10 pr-10 py-3 bg-surface-container-high border border-outline-variant rounded-lg text-on-surface text-body-md font-body-md appearance-none focus:outline-none transition-colors duration-200"
                  id="koperasiType"
                >
                  <option disabled="" value="">Pilih jenis koperasi...</option>
                  <option value="simpan_pinjam">Simpan Pinjam</option>
                  <option value="pertanian">Pertanian</option>
                  <option selected="" value="peternakan">Peternakan</option>
                  <option value="perdagangan">Perdagangan Umum</option>
                </select>
                <div
                  class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-on-surface-variant"
                >
                  <span class="material-symbols-outlined text-[20px]"
                    >expand_more</span
                  >
                </div>
              </div>
            </div>
            <!-- Input: Tahun Berdiri -->
            <div class="space-y-2">
              <label
                class="text-label-md font-label-md text-on-surface uppercase tracking-wider block"
                for="koperasiYear"
                >Tahun Berdiri (Opsional)</label
              >
              <div class="relative w-1/2">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant"
                >
                  <span class="material-symbols-outlined text-[20px]"
                    >calendar_today</span
                  >
                </div>
                <input
                  class="block w-full pl-10 pr-3 py-3 bg-surface-container-high border border-outline-variant rounded-lg text-on-surface text-body-md font-body-md placeholder-on-surface-variant/50 focus:outline-none transition-colors duration-200"
                  id="koperasiYear"
                  max="2099"
                  min="1900"
                  placeholder="YYYY"
                  type="number"
                />
              </div>
            </div>
          </form>
        </div>
        <!-- Footer / Actions -->
        <div
          class="px-8 py-6 bg-surface-container-low border-t border-outline-variant flex justify-between items-center"
        >
          <a href="/login.html">
            <button
              class="px-5 py-2.5 rounded-lg text-body-sm font-body-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest transition-colors flex items-center gap-2"
              type="button"
            >
              Batal
            </button>
          </a>
          <button
            class="px-6 py-2.5 rounded-lg bg-primary text-on-primary text-body-sm font-body-sm font-semibold hover:bg-primary-container transition-all duration-300 flex items-center gap-2 shadow-[0_0_15px_rgba(221,183,255,0.2)] hover:shadow-[0_0_20px_rgba(221,183,255,0.4)]"
            type="button"
          >
            Lanjut ke Lokasi
            <span class="material-symbols-outlined text-[18px]"
              >arrow_forward</span
            >
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
